<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>*{margin:0;padding:0}html,body{width:1920px;height:1080px;overflow:hidden;background:#0c1715}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// The intro in the landing page's own look: an isometric factory line on deep teal, amber light beams,
// the Symbiotic Compiler helix. The symbiote comes down the beam, bonds to every station, cools the
// oven when it catches fire, then sends a warning.
const cv=document.getElementById('c'),X=cv.getContext('2d'),W=1920,H=1080;
const C={bg:'#0c1715',bg2:'#10211e',ivory:'#f0eee4',amber:'#e4b977',sand:'#f3dcae',green:'#9fd08a',mint:'#7fe6b4',
  red:'#e0876b',hot:'#ff6a3a',muted:'#a6b7ad',line:'rgba(174,194,155,.2)',panel:'rgba(20,40,36,.82)'};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,s,e)=>cl((t-s)/(e-s)),lerp=(a,b,k)=>a+(b-a)*k;
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,es=x=>x*x*(3-2*x);
const rnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const hex=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));
const mix=(a,b,k)=>{const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],cl(k)))).join(',')})`};
const rgba=(h,a)=>{const v=hex(h);return `rgba(${v[0]},${v[1]},${v[2]},${a})`};

// the beats
const TAKE=1.6,LAND=2.5,SPREAD=4.4,PUSH=4.6,FIRE=5.0,COOL=8.0,MSG=10.0,LOGO=12.0;

// ---------- isometric projection ----------
const S=82,OX=900,OY=290;
const iso=(x,y,z=0)=>[OX+(x-y)*S*.866,OY+(x+y)*S*.5-z*S];
function poly(pts,fill,stroke,lw=1.5){X.beginPath();pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.closePath();
  if(fill){X.fillStyle=fill;X.fill()}if(stroke){X.strokeStyle=stroke;X.lineWidth=lw;X.stroke()}}
function box(x,y,z,w,d,h,top,left,right,edge){
  const T=[iso(x,y,z+h),iso(x+w,y,z+h),iso(x+w,y+d,z+h),iso(x,y+d,z+h)];
  poly([iso(x,y+d,z),iso(x+w,y+d,z),iso(x+w,y+d,z+h),iso(x,y+d,z+h)],left);
  poly([iso(x+w,y,z),iso(x+w,y+d,z),iso(x+w,y+d,z+h),iso(x+w,y,z+h)],right);
  poly(T,top,edge||'rgba(240,238,228,.18)',1.2);return T;
}
// ---------- the factory ----------
const STA=[ // name, x, w, d, h
 ['INTAKE',1.0,1.4,1.4,1.0],['ROBOT · TR',3.5,1.3,1.3,.55],['OVEN · OVN1',6.0,1.8,1.6,1.35],['INSPECTION',9.0,1.5,1.4,.85],['PACKING',11.4,1.6,1.4,1.1]];
const SY=1.0,BELT=2.95;
function skyline(t){
  for(let i=0;i<14;i++){const x=40+i*140+rnd(i)*40,w=90+rnd(i*3)*70,h=160+rnd(i*5)*260;
    X.fillStyle='#0f2420';X.fillRect(x,700-h,w,h+400);
    for(let r=0;r<8;r++)for(let c=0;c<3;c++)if(rnd(i*31+r*7+c)>.8){X.fillStyle=rgba(C.amber,.35+.3*rnd(r+c));X.fillRect(x+14+c*(w-28)/3,720-h+20+r*30,6,12)}}
}
function beams(t,k=1){ // long amber light shafts from above
  X.save();X.globalCompositeOperation='lighter';
  [[1150,140,.10],[760,90,.05],[1560,110,.05]].forEach(([x,w,a],i)=>{const sw=Math.sin(t*.4+i)*20;
    const g=X.createLinearGradient(0,-100,0,900);g.addColorStop(0,rgba(C.amber,a*1.6*k));g.addColorStop(1,rgba(C.amber,0));X.fillStyle=g;
    X.beginPath();X.moveTo(x-w*.3+sw,-100);X.lineTo(x+w*.3+sw,-100);X.lineTo(x+w*1.6,900);X.lineTo(x-w*1.6,900);X.fill()});
  X.restore();
}
function stars(t){for(let i=0;i<70;i++){const a=.25+.35*Math.sin(t*1.3+i*2.1);X.fillStyle=rgba(C.ivory,a*.5);X.beginPath();X.arc(rnd(i)*W,rnd(i+99)*620,1+rnd(i+7)*1.4,0,7);X.fill()}}
// heat of the oven (0..1) and its temperature
function heatAt(t){return Math.pow(P(t,FIRE,COOL),1.25)*(1-es(P(t,COOL+.2,COOL+1.6)))}
function tempAt(t){return t<COOL?lerp(238,268,Math.pow(P(t,FIRE,COOL),1.3)):lerp(268,240,es(P(t,COOL+.2,COOL+1.8)))}
function station(i,t,bond){
  const [name,x,w,d,h]=STA[i];let top='#b9cfc1',left='#87a395',right='#6a8679';
  if(i==2){const hh=heatAt(t);top=mix(top,'#f0a37a',hh*.8);left=mix(left,'#c4553a',hh*.8);right=mix(right,'#9a3a28',hh*.8)}
  const glowEdge=bond>0?rgba(i==2&&t>COOL?C.mint:C.amber,.25+.6*bond):null;
  const T=box(x,SY,0,w,d,h,top,left,right,glowEdge);
  // details per station
  if(i==0)box(x+.25,SY+.3,h,.9,.8,.18,'#d3e2d8','#9fb7aa','#83a092');
  if(i==1){box(x+.4,SY+.4,h,.5,.5,.25,'#3a4b47','#26332f','#1d2926');
    const a=Math.sin(t*1.6)*.25;poly([iso(x+.65,SY+.65,h+.25),iso(x+.65+Math.cos(a)*1.0,SY+.65+Math.sin(a)*.4,h+.85),iso(x+.7+Math.cos(a)*1.0,SY+.7+Math.sin(a)*.4,h+.9),iso(x+.7,SY+.7,h+.3)],C.amber)}
  if(i==2){ // window on the front, a vent on top
    const hh=heatAt(t),cool=t>COOL?P(t,COOL+.2,COOL+1.6):0;
    const wc=t<COOL?mix('#ff9a4a','#fff1c4',hh*1.3):mix('#fff1c4','#c8653a',cool);
    X.save();X.shadowColor=wc;X.shadowBlur=20+60*hh;poly([iso(x+.35,SY+d,.35),iso(x+w-.35,SY+d,.35),iso(x+w-.35,SY+d,h-.3),iso(x+.35,SY+d,h-.3)],wc);X.restore();
    box(x+1.05,SY+.35,h,.45,.45,.35,'#3a4b47','#26332f','#1d2926');}
  if(i==3){box(x+.15,SY+.2,h,.18,1.0,.55,'#d3e2d8','#9fb7aa','#83a092');box(x+1.15,SY+.2,h,.18,1.0,.55,'#d3e2d8','#9fb7aa','#83a092');
    box(x+.15,SY+.2,h+.55,1.18,1.0,.12,'#d3e2d8','#9fb7aa','#83a092');}
  if(i==4)box(x+.3,SY+.3,h,1.0,.8,.3,'#d9e6dd','#a8bfb2','#8aa597');
  // label on the platform
  // status pin above the station
  const pp=iso(x+w/2,SY+d/2,h+(i==3?1.2:.95));
  let pc=mix('#e0876b',C.green,bond);if(i==2&&tempAt(t)>250)pc=mix('#7a2a1a','#ff5a3a',.5+.5*Math.sin(t*9));
  X.strokeStyle=rgba(C.ivory,.25);X.lineWidth=1.5;X.beginPath();X.moveTo(pp[0],pp[1]+8);X.lineTo(pp[0],iso(x+w/2,SY+d/2,h)[1]);X.stroke();
  X.save();X.shadowColor=pc;X.shadowBlur=18;X.fillStyle=pc;X.beginPath();X.arc(pp[0],pp[1],8,0,7);X.fill();X.restore();
}
function platform(t){
  box(0,0,-.35,14,4.4,.35,'#2c4a42','#1e3530','#172b27','rgba(174,194,155,.25)');
  X.save();X.strokeStyle='rgba(174,194,155,.08)';X.lineWidth=1;
  for(let i=1;i<14;i++){const a=iso(i,0),b=iso(i,4.4);X.beginPath();X.moveTo(a[0],a[1]);X.lineTo(b[0],b[1]);X.stroke()}
  for(let j=1;j<5;j++){const a=iso(0,j*.88),b=iso(14,j*.88);X.beginPath();X.moveTo(a[0],a[1]);X.lineTo(b[0],b[1]);X.stroke()}X.restore();
}
function belt(t){
  box(.4,BELT,0,13.2,.7,.1,'#1a2623','#121b19','#0e1614');
  X.save();X.strokeStyle=rgba(C.amber,.8);X.lineWidth=3;X.setLineDash([10,16]);X.lineDashOffset=-t*40;
  const a=iso(.5,BELT+.35,.1),b=iso(13.5,BELT+.35,.1);X.beginPath();X.moveTo(a[0],a[1]);X.lineTo(b[0],b[1]);X.stroke();X.restore();
  for(let k=0;k<8;k++){const x=((t*.7+k*1.65)%12.6)+.6;box(x,BELT+.18,.1,.34,.34,.3,'#e8efe9','#b9c9bf','#9db2a5')}
}
// ---------- the symbiote: twin strands, amber and mint ----------
const DROP=[5.2,2.65];
function strand(pts,col,w,glow=14,a=1){if(pts.length<2)return;X.save();X.globalAlpha=a;X.lineCap='round';X.lineJoin='round';X.shadowColor=col;X.shadowBlur=glow;X.strokeStyle=col;X.lineWidth=w;
  X.beginPath();pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.stroke();X.restore();}
function dots(pts,col,t,every=9){X.save();X.fillStyle=col;X.shadowColor=col;X.shadowBlur=10;for(let i=0;i<pts.length;i+=every){const L=pts.length,j=((i+Math.floor(t*30))%L+L)%L,p=pts[j];X.beginPath();X.arc(p[0],p[1],2.6,0,7);X.fill()}X.restore();}
function helixDown(t){ // the helix comes down the light beam onto the line
  const g=eo(P(t,TAKE,LAND)),top=9,bot=.3,zEnd=lerp(top,bot,g);if(t<TAKE)return;
  const fade=1-P(t,LAND+.2,LAND+.7);if(fade<=0)return;
  for(const [ph,col] of [[0,C.amber],[Math.PI,C.mint]]){const pts=[];
    for(let z=top;z>=zEnd;z-=.05){const a=z*2.2+t*4+ph;pts.push(iso(DROP[0]+Math.cos(a)*.35,DROP[1]+Math.sin(a)*.35,z))}
    strand(pts,col,4,16,fade)}
}
function lineStrands(t){ // from the drop point, both ways along the line, twisting
  const g=eio(P(t,LAND,SPREAD));if(g<=0)return;
  const xs=[lerp(DROP[0],.6,g),lerp(DROP[0],13.4,g)];
  for(const [ph,col] of [[0,C.amber],[Math.PI,C.mint]])for(const xe of xs){const pts=[],dir=xe<DROP[0]?-1:1;
    for(let x=DROP[0];dir*(xe-x)>=0;x+=dir*.05){const a=x*1.5+t*2+ph;pts.push(iso(x,DROP[1]+Math.sin(a)*.1,.32+Math.cos(a)*.1))}
    strand(pts,col,2.6,10,.85);if(col==C.amber)dots(pts,C.sand,t*(dir))}
  return xs;
}
function bondAt(i,t){const [,x,w]=STA[i],cx=x+w/2,g=eio(P(t,LAND,SPREAD)),front=cx<DROP[0]?lerp(DROP[0],.6,g):lerp(DROP[0],13.4,g);
  const reached=cx<DROP[0]?front<=cx:front>=cx;if(!reached)return 0;
  // the time the front passed this station
  const k=Math.abs(cx-DROP[0])/(cx<DROP[0]?DROP[0]-.6:13.4-DROP[0]);let lo=0,hi=1;for(let n=0;n<20;n++){const m=(lo+hi)/2;eio(m)<k?lo=m:hi=m}
  const tp=LAND+(SPREAD-LAND)*lo;return es(P(t,tp,tp+.4));}
function rings(t){ // each station gets a ring of light as it bonds
  STA.forEach(([,x,w,d,h],i)=>{const b=bondAt(i,t);if(b<=0)return;const pts=[],rx=w/2+.25,ry=d/2+.25,cx=x+w/2,cy=SY+d/2,z=h*.55;
    for(let a=0;a<=Math.PI*2*b+.01;a+=.08)pts.push(iso(cx+Math.cos(a)*rx,cy+Math.sin(a)*ry,z));
    const col=i==2&&t>COOL?C.mint:C.amber;strand(pts,col,2.6,12,.85*(i==2&&t>COOL?1:1))});
}
function wrapOven(t){ // the strands spiral up the oven and cool it
  if(t<COOL)return;const [,x,w,d,h]=STA[2],g=eo(P(t,COOL,COOL+.8));
  for(const [ph,col] of [[0,C.mint],[Math.PI,C.green]]){const pts=[],N=3.2*g;
    for(let a=0;a<=N*Math.PI*2;a+=.06){const u=a/(3.2*Math.PI*2),r=1.12,ang=a+ph+t*1.2;
      pts.push(iso(x+w/2+Math.cos(ang)*(w/2+.18)*r,SY+d/2+Math.sin(ang)*(d/2+.18)*r,u*(h+.4)))}
    strand(pts,col,3.4,16,.95)}
}
// fire and the cold after it
function flame(x,y,w,h,t,seed){ // soft tongues: deep orange at the base, pale gold at the tip
  if(h<3)return;X.save();X.globalCompositeOperation='lighter';X.filter='blur(1.5px)';
  for(const [k,c0,c1] of [[1,'rgba(255,90,40,.55)','rgba(255,150,60,0)'],[.7,'rgba(255,160,60,.7)','rgba(255,210,120,0)'],[.4,'rgba(255,240,190,.85)','rgba(255,240,190,0)']])
    for(let i=0;i<7;i++){const ph=i*1.9+seed,fl=.55+.25*Math.sin(t*6.1+ph)+.2*Math.sin(t*9.7+ph*1.3),fx=x+w*(i+.5)/7+Math.sin(t*2.7+ph)*4,fh=h*k*fl,bw=w/7*1.4*k+4,sw=Math.sin(t*3.9+ph)*bw*.6;
      const g=X.createLinearGradient(0,y,0,y-fh);g.addColorStop(0,c0);g.addColorStop(1,c1);X.fillStyle=g;
      X.beginPath();X.moveTo(fx-bw,y);X.bezierCurveTo(fx-bw,y-fh*.5,fx+sw-bw*.2,y-fh*.8,fx+sw,y-fh);X.bezierCurveTo(fx+sw+bw*.2,y-fh*.8,fx+bw,y-fh*.5,fx+bw,y);X.fill()}
  X.restore();
}
function fireAndCold(t){
  const [,x,w,d,h]=STA[2],hh=heatAt(t);
  if(hh>0){const v=iso(x+1.27,SY+.57,h+.35);flame(v[0]-44,v[1]+6,88,300*hh,t,1);
    // heat shimmer
    X.save();X.strokeStyle=rgba('#ffd9b0',.18*hh);X.lineWidth=2;for(let i=0;i<6;i++){const sx=v[0]-70+i*28;X.beginPath();
      for(let k=0;k<30;k++){const yy=v[1]-60-k*9,xx=sx+Math.sin(k*.5-t*6+i)*6;k?X.lineTo(xx,yy):X.moveTo(xx,yy)}X.stroke()}X.restore();
    // a warning ring on the platform
    const c=iso(x+w/2,SY+d/2,0),pu=.5+.5*Math.sin(t*6);X.save();X.strokeStyle=rgba('#ff6a3a',.35*hh*(1-pu)+.1);X.lineWidth=3;
    X.beginPath();X.ellipse(c[0],c[1],(140+60*pu),(70+30*pu),0,0,7);X.stroke();X.restore();}
  const cold=t>COOL?P(t,COOL+.1,COOL+.5)*(1-P(t,COOL+1.8,COOL+2.6)):0;
  if(cold>0){X.save();X.globalCompositeOperation='lighter';
    for(let i=0;i<40;i++){const k=((t*.35+rnd(i))%1),p=iso(x+w/2+(rnd(i+3)-.5)*2.4,SY+d/2+(rnd(i+5)-.5)*2,k*2.6);
      X.fillStyle=rgba(C.mint,.6*(1-k)*cold);X.beginPath();X.arc(p[0]+Math.sin(t*2+i)*8,p[1],2+2*rnd(i+9),0,7);X.fill()}
    X.filter='blur(12px)';for(let i=0;i<8;i++){const k=((t*.5+i/8)%1),p=iso(x+w/2,SY+d/2,h+.3+k*2);X.fillStyle=rgba('#dff7ee',.22*(1-k)*cold);X.beginPath();X.arc(p[0]+(rnd(i)-.5)*80*k,p[1],20+60*k,0,7);X.fill()}
    X.restore();}
}
// ---------- camera ----------
function camAt(t){const k=eio(P(t,PUSH,COOL+.2)),f=iso(6.9,1.8,.9);return {s:lerp(1,2.05,k),cx:lerp(960,f[0],k),cy:lerp(560,f[1],k)}}
function cam(c){X.setTransform(c.s,0,0,c.s,W/2-c.cx*c.s,H/2-c.cy*c.s)}
const toScreen=(c,p)=>[W/2+(p[0]-c.cx)*c.s,H/2+(p[1]-c.cy)*c.s];
function screen(){X.setTransform(1,0,0,1,0,0)}
// ---------- type and UI, in the landing page's voice ----------
function headline(eyebrow,text,t,s,e,{x=110,y=170,size=68,accent}={}){
  if(t<s||t>e)return;const k=es(P(t,s,s+.6))*(1-es(P(t,e-.4,e)));screen();X.save();X.globalAlpha=k;X.translate(0,(1-k)*16);
  X.font='600 20px Manrope';X.letterSpacing='5px';X.fillStyle=C.amber;X.fillText(eyebrow,x,y);
  X.letterSpacing='-1.5px';X.font=`500 ${size}px Manrope`;X.fillStyle=C.ivory;
  if(accent){const [a,b]=text.split('|');X.fillText(a,x,y+size*1.15);const wa=X.measureText(a).width;X.fillStyle=C.amber;X.fillText(b,x+wa,y+size*1.15)}else X.fillText(text,x,y+size*1.15);
  X.restore();}
function glass(x,y,w,h,r=22){X.save();X.shadowColor='rgba(0,0,0,.45)';X.shadowBlur=40;X.fillStyle=C.panel;X.beginPath();X.roundRect(x,y,w,h,r);X.fill();X.restore();
  X.strokeStyle='rgba(228,185,119,.35)';X.lineWidth=1.5;X.beginPath();X.roundRect(x,y,w,h,r);X.stroke();}
function tempChip(t,c){ // floats beside the oven
  if(t<FIRE+.2||t>MSG+.4)return;const a=es(P(t,FIRE+.2,FIRE+.7))*(1-es(P(t,MSG,MSG+.4)));const T=tempAt(t),over=T>250,cooled=t>COOL+1.8;
  const p=toScreen(c,iso(7.9,.6,1.7));screen();X.save();X.globalAlpha=a;const x=p[0]+30,y=p[1]-150;
  glass(x,y,330,150);X.font='600 15px Manrope';X.letterSpacing='3px';X.fillStyle=C.amber;X.fillText('OVN1 · LIMIT 250°C',x+24,y+38);
  X.letterSpacing='-1px';X.font='600 64px Manrope';X.fillStyle=cooled?C.green:over?mix('#e0876b','#ff5a3a',.5+.5*Math.sin(t*8)):C.ivory;X.fillText(`${T.toFixed(0)}°C`,x+22,y+108);
  X.font='600 15px Manrope';X.letterSpacing='3px';X.fillStyle=cooled?C.green:t>COOL?C.mint:over?'#ff8a6a':C.muted;X.fillText(cooled?'COOLED':t>COOL?'COOLING':over?'OVER LIMIT':'RISING',x+24,y+134);
  X.restore();}
function notice(t){
  if(t<MSG)return;const k=eo(P(t,MSG,MSG+.55));screen();X.save();X.globalAlpha=es(P(t,MSG,MSG+.3));X.translate((1-k)*220,0);
  const x=1040,y=600;glass(x,y,780,300,26);
  X.fillStyle='#ffd391';X.beginPath();X.roundRect(x+34,y+34,62,62,16);X.fill();X.lineCap='round';X.strokeStyle='#0c1715';X.lineWidth=8;
  X.beginPath();X.moveTo(x+50,y+54);X.lineTo(x+80,y+54);X.moveTo(x+65,y+54);X.lineTo(x+65,y+76);X.stroke();X.fillStyle='#1c7a58';X.beginPath();X.arc(x+65,y+85,4.5,0,7);X.fill();
  X.font='700 28px Manrope';X.fillStyle=C.ivory;X.fillText('Tolerance',x+116,y+60);X.font='500 20px Manrope';X.fillStyle=C.muted;X.fillText('now',x+116,y+88);
  X.font='700 36px Manrope';X.fillStyle='#f0a37a';X.fillText('OVN1 overheated · 268°C',x+34,y+160);
  X.font='500 27px Manrope';X.fillStyle=C.ivory;X.fillText('I cooled it to 240°C and held the line.',x+34,y+212);
  X.fillStyle=C.muted;X.fillText('Review the cause when you are ready.',x+34,y+252);X.restore();}
function shotLogo(t){
  screen();X.fillStyle=C.bg;X.fillRect(0,0,W,H);
  const g=X.createRadialGradient(960,470,40,960,470,900);g.addColorStop(0,'rgba(228,185,119,.16)');g.addColorStop(1,'rgba(12,23,21,0)');X.fillStyle=g;X.fillRect(0,0,W,H);
  stars(t);beams(t,.6);
  const k=es(P(t,LOGO+.1,LOGO+.8));X.save();X.globalAlpha=k;X.translate(960,380);X.scale(.92+.08*eo(k),.92+.08*eo(k));
  X.fillStyle='#ffd391';X.beginPath();X.roundRect(-90,-90,180,180,42);X.fill();X.lineCap='round';X.strokeStyle='#0c1715';X.lineWidth=22;
