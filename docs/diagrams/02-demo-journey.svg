<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" font-family="Helvetica, Arial, sans-serif" role="img"><title>The demo journey</title><desc>Drop documents, connect machines, confirm the overview, build the 3D, a fault is found, the gate decides.</desc><rect width="680" height="290" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="30" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.7"/><text x="125.0" y="49.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Drop documents</text><text x="125.0" y="66.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Reader extracts claims</text><line x1="210" y1="58" x2="253" y2="58" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="255" y="30" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.7"/><text x="340.0" y="49.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Connect machines</text><text x="340.0" y="66.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Scout profiles them</text><line x1="425" y1="58" x2="468" y2="58" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="470" y="30" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.7"/><text x="555.0" y="49.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Confirm overview</text><text x="555.0" y="66.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">Written and 2D plan</text><path d="M555 86 L555 118 L125 118 L125 148" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="40" y="150" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/><text x="125.0" y="169.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Build the 3D</text><text x="125.0" y="186.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">From the plan</text><line x1="210" y1="178" x2="253" y2="178" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="255" y="150" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/><text x="340.0" y="169.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Fault found</text><text x="340.0" y="186.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">Agents gather evidence</text><line x1="425" y1="178" x2="468" y2="178" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="470" y="150" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.7"/><text x="555.0" y="169.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Gate decides</text><text x="555.0" y="186.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">Run alone or ask you</text><rect x="40" y="244" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.7"/><text x="46.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A"></text><text x="58" y="254" text-anchor="start" font-size="12" font-weight="400" fill="#5F5E5A">You provide</text><rect x="150" y="244" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/><text x="156.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489"></text><text x="168" y="254" text-anchor="start" font-size="12" font-weight="400" fill="#5F5E5A">Agents work</text><rect x="260" y="244" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.7"/><text x="266.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13"></text><text x="278" y="254" text-anchor="start" font-size="12" font-weight="400" fill="#5F5E5A">A decision</text></svg>
