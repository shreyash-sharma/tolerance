<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" font-family="Helvetica, Arial, sans-serif" role="img"><title>The safety gate and the safety score</title><desc>The planner proposes an action. Hard limits block it if broken. Otherwise Warden scores it 0 to 100. Below the floor it is refused, between floor and limit a person approves, above the limit it runs itself. The user sets both lines and sees a backtest.</desc><rect width="680" height="440" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="190" y="24" width="300" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/><text x="340.0" y="46.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Planner proposes an action</text><line x1="340" y1="68" x2="340" y2="90" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="190" y="92" width="300" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.7"/><text x="340.0" y="109.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Hard limits from your documents</text><text x="340.0" y="126.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">The score never overrides them</text><line x1="490" y1="118" x2="528" y2="118" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="530" y="92" width="110" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.7"/><text x="585.0" y="109.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Blocked</text><text x="585.0" y="126.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">breaks a limit</text><line x1="340" y1="144" x2="340" y2="166" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="190" y="168" width="300" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.7"/><text x="340.0" y="185.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Warden scores it, 0 to 100</text><text x="340.0" y="202.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">Reversible, small reach, strong evidence</text><line x1="340" y1="220" x2="340" y2="244" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="40" y="246" width="240" height="40" rx="0" fill="#F1EFE8" stroke="#888780" stroke-width="0.7"/><text x="160.0" y="266.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Refused</text><rect x="280" y="246" width="240" height="40" rx="0" fill="#FAECE7" stroke="#993C1D" stroke-width="0.7"/><text x="400.0" y="266.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">You approve</text><rect x="520" y="246" width="120" height="40" rx="0" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7"/><text x="580.0" y="266.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Runs itself</text><path d="M280 288 L274 298 L286 298 Z" fill="#2C2C2A"/><path d="M520 288 L514 298 L526 298 Z" fill="#2C2C2A"/><text x="40" y="316" text-anchor="start" font-size="12" font-weight="400" fill="#5F5E5A">0</text><text x="280" y="326" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A">Floor 40</text><text x="520" y="326" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A">Limit 80</text><text x="640" y="316" text-anchor="end" font-size="12" font-weight="400" fill="#5F5E5A">100</text><line x1="340" y1="336" x2="340" y2="356" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="190" y="358" width="300" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.7"/><text x="340.0" y="375.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">You set both lines</text><text x="340.0" y="392.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Backtest on past incidents first</text></svg>
